# Preparatory experiment for the FGI visual input contract.
#
# This configuration validates that FGI-style visual normalization can be
# selected independently from the classifier. The dedicated multimodal FGI
# model is not implemented yet, so this experiment uses the existing video CNN.

experiment:
  name: fgi_preprocessing
  version: 1
  seed: 42
  runs_root: runs
  output_dir: runs/fgi_preprocessing

data:
  manifest_dir: data/manifests
  train_manifest: data/manifests/train_manifest.csv
  val_manifest: data/manifests/val_manifest.csv
  test_manifest: data/manifests/test_manifest.csv
  label_mapping:
    real: 0
    fake: 1

video:
  preprocessing:
    name: resize_normalize
    frame_size: 224
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

model:
  name: video_cnn_baseline
  input_channels: 3
  num_classes: 2
  conv_channels: [16, 32, 64]
  dense_channels: [128]
  dropout: 0.3

training:
  device: auto
  epochs: 20
  batch_size: 4
  num_workers: 0
  optimizer:
    name: adam
    learning_rate: 0.0001
    weight_decay: 0.00001
  loss:
    name: cross_entropy
    class_weights: balanced
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

validation:
  batch_size: 4
  interval_epochs: 1
  metric_for_best_checkpoint: val_loss

evaluation:
  auto_after_training: true
  batch_size: 4
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc

checkpointing:
  save_dir: checkpoints
  save_best: true
  save_last: true

logging:
  log_dir: logs
  level: info
  tensorboard: false
