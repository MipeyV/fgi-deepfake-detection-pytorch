# Baseline audio-only experiment.
#
# This file describes the first audio baseline to implement after the data
# preprocessing pipeline is ready. It is intentionally explicit so the training
# code can read one source of truth instead of hard-coding experiment choices.

experiment:
  name: baseline_audio
  version: 1
  seed: 42
  runs_root: runs
  output_dir: runs/baseline_audio

data:
  manifest_dir: data/manifests
  train_manifest: data/manifests/train_manifest.csv
  val_manifest: data/manifests/val_manifest.csv
  test_manifest: data/manifests/test_manifest.csv
  label_mapping:
    real: 0
    fake: 1

audio:
  source_file: audio.wav
  sample_rate: 48000
  duration_seconds: 1.0
  mono: true
  normalize: true

features:
  type: mel_spectrogram
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  f_min: 20
  f_max: 24000
  power: 2.0
  log_scale: true

model:
  name: audio_cnn_baseline
  input_channels: 1
  num_classes: 2
  conv_channels: [32, 64, 128]
  dense_channels: [256, 128]
  dropout: 0.3

training:
  device: auto
  epochs: 30
  batch_size: 32
  num_workers: 0
  optimizer:
    name: adam
    learning_rate: 0.001
    weight_decay: 0.00001
  loss:
    name: cross_entropy
  scheduler:
    name: cosine_annealing
    enabled: true
    t_max: 30
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.001

validation:
  batch_size: 32
  interval_epochs: 1
  metric_for_best_checkpoint: val_loss

evaluation:
  batch_size: 32
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc

checkpointing:
  save_dir: checkpoints
  save_best: true
  save_last: true

logging:
  log_dir: logs
  level: info
  tensorboard: false
