# R3D-18 video-only experiment initialized from Kinetics-400 weights.

experiment:
  name: r3d18_video
  version: 1
  seed: 42
  runs_root: runs
  output_dir: runs/r3d18_video

data:
  manifest_dir: data/manifests
  train_manifest: data/manifests/train_manifest.csv
  val_manifest: data/manifests/val_manifest.csv
  test_manifest: data/manifests/test_manifest.csv
  label_mapping:
    real: 0
    fake: 1

video:
  preprocessing:
    name: resize_center_crop
    resize_size: [128, 171]
    crop_size: 112

model:
  name: r3d18
  num_classes: 2
  weights: kinetics400_v1
  normalize: true
  dropout: 0.3

training:
  device: auto
  epochs: 20
  batch_size: 4
  num_workers: 0
  optimizer:
    name: adam
    learning_rate: 0.0001
    weight_decay: 0.00001
  loss:
    name: cross_entropy
    class_weights: balanced
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

validation:
  batch_size: 4
  interval_epochs: 1
  metric_for_best_checkpoint: val_loss

evaluation:
  auto_after_training: true
  batch_size: 4
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc

checkpointing:
  save_dir: checkpoints
  save_best: true
  save_last: true

logging:
  log_dir: logs
  level: info
  tensorboard: false
